name: Test SignalDig MCP

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install "mcp>=1.0,<2.0"
      - name: Test connection
        env:
          SIGNALDIG_API_KEY: ${{ secrets.SIGNALDIG_API_KEY }}
        run: python signaldig_test.py
